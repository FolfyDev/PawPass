services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pawpass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-pawpass}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pawpass} -d ${POSTGRES_DB:-pawpass}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pawpass}:${POSTGRES_PASSWORD:?required}@db:5432/${POSTGRES_DB:-pawpass}
    volumes:
      - uploads:/app/uploads
      - ./certs:/app/certs:ro
    networks: [frontend, backend]
    ports:
      - "127.0.0.1:${SERVER_PORT:-4000}:4000"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 200
    mem_limit: 1g
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    networks: [frontend]
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    pids_limit: 100
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?required}
    networks: [frontend]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 128m

networks:
  frontend:
  backend:
    internal: true

volumes:
  db-data:
  uploads: