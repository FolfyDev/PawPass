services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pawpass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pawpass}
      POSTGRES_DB: ${POSTGRES_DB:-pawpass}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pawpass}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pawpass}:${POSTGRES_PASSWORD:-pawpass}@db:5432/${POSTGRES_DB:-pawpass}
    volumes:
      - uploads:/app/uploads
      - ./certs:/app/certs:ro
    # Bound to localhost only. The browser never talks to this port directly —
    # nginx (the web service) proxies /api, /t, and /l to it over the internal
    # compose network, which doesn't need a published port at all. This stays
    # reachable from the host itself (curl, prisma studio) for debugging.
    ports:
      - "127.0.0.1:${SERVER_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db-data:
  uploads:
