services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pawpass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pawpass}
      POSTGRES_DB: ${POSTGRES_DB:-pawpass}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pawpass}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pawpass}:${POSTGRES_PASSWORD:-pawpass}@db:5432/${POSTGRES_DB:-pawpass}
    volumes:
      - uploads:/app/uploads
      - ./certs:/app/certs:ro
    ports:
      - "${SERVER_PORT:-4000}:4000"

  web:
    # No VITE_API_BASE build arg — it defaults to "" (see web/Dockerfile),
    # meaning the frontend calls /api/... as a path relative to whatever
    # origin the page was loaded from. nginx (nginx.conf) already proxies
    # /api/ straight through to the server container, so this always works
    # regardless of the host/IP/domain/port the app is actually reached at.
    # Pointing this at PUBLIC_URL instead breaks the moment PUBLIC_URL uses a
    # different port than WEB_URL and that port isn't opened to the network
    # the browser is on (e.g. a phone that can reach :8080 but not :4000).
    build:
      context: ./web
    restart: unless-stopped
    depends_on: [server]
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db-data:
  uploads:
