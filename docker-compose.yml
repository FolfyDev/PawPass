services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pawpass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pawpass}
      POSTGRES_DB: ${POSTGRES_DB:-pawpass}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pawpass}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pawpass}:${POSTGRES_PASSWORD:-pawpass}@db:5432/${POSTGRES_DB:-pawpass}
    volumes:
      - uploads:/app/uploads
      - ./certs:/app/certs:ro
    ports:
      - "${SERVER_PORT:-4000}:4000"

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE: ${PUBLIC_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on: [server]
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db-data:
  uploads:
