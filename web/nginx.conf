server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Kept in sync by hand with the equivalent helmet() config in
  # server/src/app.js — that one only covers responses the Node server sends
  # (API JSON, the /t/:secret ticket page); the React SPA itself is served
  # straight from these static files by nginx and never touches the Node
  # server, so it needs its own copy of the same policy to actually be
  # covered (this is the surface the admin badge designer's
  # dangerouslySetInnerHTML SVG preview lives on).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-src https://oauth.telegram.org; object-src 'none'; base-uri 'self'; form-action 'self'" always;

  # Single-page app: everything that is not a file falls through to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /t/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /l/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
  # Uploaded files live on the server container's filesystem (the `uploads`
  # named volume), not this one's static root — without this, a request here
  # falls through to the SPA catch-all below and silently gets index.html
  # back instead of the actual file.
  location /uploads/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /robots.txt  { proxy_pass http://server:4000; proxy_set_header Host $host; }
  location = /sitemap.xml { proxy_pass http://server:4000; proxy_set_header Host $host; }
}
