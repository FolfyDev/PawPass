# This file is included inside nginx's http block (conf.d), so the map and
# gzip settings below apply to this server.

# Vite fingerprints everything under /assets/ (the name changes when the
# content does), so browsers can keep those for a year. index.html must
# always be revalidated or a deploy would leave people on old asset names.
# Everything else (the API, uploads) gets no header from here: "" means
# nginx adds nothing and the app's own caching rules stand.
map $uri $static_cache_control {
  ~^/assets/   "public, max-age=31536000, immutable";
  /index.html  "no-cache";
  default      "";
}

gzip on;
gzip_vary on;
gzip_proxied any;           # also behind Cloudflare, which sends a Via header
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/plain text/csv application/manifest+json;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Cache-Control $static_cache_control always;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://oauth.telegram.org https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # The offline-scanner service worker: always revalidated, so a deploy's
  # new one is picked up straight away.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /t/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /l/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
  
  location /uploads/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /robots.txt  { proxy_pass http://server:4000; proxy_set_header Host $host; }
  location = /sitemap.xml { proxy_pass http://server:4000; proxy_set_header Host $host; }
}
