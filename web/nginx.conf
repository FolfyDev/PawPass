server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: everything that is not a file falls through to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ { proxy_pass http://server:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /t/   { proxy_pass http://server:4000; proxy_set_header Host $host; }
}
