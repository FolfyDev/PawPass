server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Baseline hardening for the static SPA response itself — helmet already
  # covers the API side (see server/src/index.js). "always" so these also
  # land on non-200 responses (e.g. the try_files fallback to index.html).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Single-page app: everything that is not a file falls through to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Forwards the real client IP to Express (trust proxy is set to 1 there) —
  # without this, every request looks like it comes from nginx itself, which
  # would break per-client rate limiting on the auth routes.
  location /api/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /t/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Generated server-side from WEB_URL (see server/src/index.js) so the
  # domain is always right without rebuilding this image.
  location = /robots.txt  { proxy_pass http://server:4000; proxy_set_header Host $host; }
  location = /sitemap.xml { proxy_pass http://server:4000; proxy_set_header Host $host; }
}
